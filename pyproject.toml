[project]
name = "stockfunnel"
version = "0.1.0"
description = "Evidence-based, guard-railed stock selection funnel for US and Indian equities"
readme = "README.md"
authors = [
    { name = "Abhilash Reddy", email = "abhi@grabians.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "yfinance>=1.7.0",
]

[project.scripts]
stockfunnel = "stockfunnel.cli:main"
stockfunnel-mcp = "stockfunnel.mcp_server:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2.3.0",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"
